name: release-please

on:
  push:
    branches:
      - main
      - v2
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to publish (must match the selected branch)
        required: true
        type: string

permissions: {}

jobs:
  pull-request:
    if: ${{github.event_name == 'push'}}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{steps.release.outputs.releases_created}}
      paths_released: ${{steps.release.outputs.paths_released}}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{secrets.GITHUB_TOKEN}}
          target-branch: ${{github.ref_name}}

  publish-package:
    needs: pull-request
    if: >-
      ${{
        !cancelled() &&
        (github.ref_name == 'main' || github.ref_name == 'v2') &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            needs.pull-request.result == 'success' &&
            needs.pull-request.outputs.releases_created == 'true' &&
            toJson(fromJson(needs.pull-request.outputs.paths_released || '[]')) != '[]'
          )
        )
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: npmjs:@ui5/manifest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
      - name: Verify requested version
        if: ${{github.event_name == 'workflow_dispatch'}}
        env:
          EXPECTED_VERSION: ${{inputs.version}}
        run: |
          node <<'NODE'
          const {version} = require('./package.json');
          if (version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Refusing to publish ${version}; requested ${process.env.EXPECTED_VERSION}`);
          }
          console.log(`Verified package version ${version}`);
          NODE
      - name: Publish to npm
        env:
          REF: ${{github.ref_name}}
        run: |
          if [ "$REF" = "v2" ]; then
            npm publish --access public --tag latest-2
          else
            npm publish --access public --tag latest
          fi
